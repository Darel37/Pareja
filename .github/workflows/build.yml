   
name: Compilar aplicación Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip -q Sorpresa_8_Meses_Proyecto_Android.zip -d proyecto

      - name: Compilar APK
        run: gradle -p proyecto assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sorpresa-8-Meses-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          
